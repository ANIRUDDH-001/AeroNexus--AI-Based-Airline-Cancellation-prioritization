# Keeps the free Render service warm so the first visitor does not wait through a cold start (Render sleeps
# after 15 idle minutes; one service running 24x7 fits inside the 750 free instance-hours a month).
# GitHub cron is best-effort (runs can slip by several minutes); for a guaranteed cadence use a free external
# monitor such as cron-job.org or UptimeRobot on the same URL. Set the repository variable RENDER_API_URL to
# override the default URL below.
name: keep-engine-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        env:
          API: ${{ vars.RENDER_API_URL || 'https://aeronexus-ai-based-airline-cancellation.onrender.com' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$API/health" > /dev/null; then echo "warm"; exit 0; fi
            sleep 20
          done
          echo "engine did not answer (asleep or down)"; exit 1
