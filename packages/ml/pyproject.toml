[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronexus-ml"
version = "0.1.0"
description = "AeroNexus ML surrogate and calibration models (Phase 5)"
requires-python = ">=3.11"
dependencies = ["aeronexus-core"]

[tool.setuptools.packages.find]
include = ["aeronexus_ml*"]
