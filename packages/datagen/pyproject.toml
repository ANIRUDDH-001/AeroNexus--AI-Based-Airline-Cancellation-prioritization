[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronexus-datagen"
version = "0.1.0"
description = "AeroNexus synthetic IndiGo-like network and disruption generator"
requires-python = ">=3.11"
dependencies = [
  "aeronexus-core",
  "numpy>=1.26",
]

[project.scripts]
aeronexus-gen = "aeronexus_datagen.cli:main"

[tool.setuptools.packages.find]
include = ["aeronexus_datagen*"]
