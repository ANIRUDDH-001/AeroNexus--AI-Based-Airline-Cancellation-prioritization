[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronexus-core"
version = "0.1.0"
description = "AeroNexus core engine: domain model, config registries, constraints, scoring, simulator, search"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["aeronexus_core*"]
